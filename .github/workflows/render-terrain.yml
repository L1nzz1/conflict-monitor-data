name: render-terrain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - name: Install python deps
        run: pip install numpy matplotlib
      - name: Render terrain hillshade
        run: python terrain/render_terrain.py all
      - name: Commit if changed
        run: |
          if ! git diff --quiet terrain/; then
            git config user.name "data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add terrain/
            git commit -m "terrain: render warzone hillshade maps"
            git push
          else
            echo "no change"
          fi
